services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - packages/web-backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./packages/web-backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: .
      dockerfile: packages/web-backend/Dockerfile
    env_file:
      - packages/web-backend/.env
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT:-3000}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_KEY: ${MQTT_KEY}
    depends_on:
      - db
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: packages/web-frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "4173:80"

volumes:
  db_data:
    name: smart_home_db_data
